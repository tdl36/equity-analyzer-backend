<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Charlie · Source collection</title>
<style>
:root{color-scheme:light;--ink:#182b3f;--muted:#52677b;--line:#dce3e9;--paper:#f4f6f8;--accent:#206f63}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:1200px;margin:auto;padding:40px 32px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:25px}.eyebrow{font:11px/1.4 ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}h1{font:38px/1.1 Georgia,serif;margin:10px 0}h2{font:25px Georgia,serif;margin:0}p{color:var(--muted);margin:10px 0}button,select,a.action{background:white;border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:10px 14px;font:inherit;cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #48a99b;outline-offset:3px}a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}.toolbar{display:flex;gap:20px;align-items:center;justify-content:space-between;margin:25px 0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}.metric{background:white;padding:20px}.metric strong{display:block;font:34px Georgia,serif}.metric span,small{font-size:12px;color:var(--muted)}.panel{background:white;border:1px solid var(--line);border-radius:8px;padding:24px;margin-top:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.task{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}.task strong{display:block}.pill{font-size:11px;font-weight:600;white-space:nowrap;background:#eef2f6;border-radius:4px;padding:4px 8px}.good{background:#e5f3ef;color:#186250}.review{background:#fff1db;color:#875307}table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}td,th{padding:13px 10px;border-bottom:1px solid var(--line);vertical-align:top}td:first-child{max-width:350px;overflow-wrap:anywhere}.table-scroll{overflow:auto}.note{border-left:3px solid #b98e48;padding:8px 16px;margin:18px 0;background:#fffaf1}.empty{padding:24px 0;color:var(--muted)}#error{background:#fff1db;padding:12px;border-radius:6px}footer{font-size:12px;color:var(--muted);padding:25px 0}@media(max-width:700px){main{padding:24px 16px}header,.toolbar{align-items:start;flex-direction:column}.grid{grid-template-columns:1fr;gap:0}.metrics{grid-template-columns:1fr 1fr}.panel{padding:18px}h1{font-size:32px}}
</style>
<main><header><div><div class="eyebrow">Charlie / Research operations</div><h1>Source collection</h1><p>Every original accounted for. Every handoff visible.</p></div><a class="action" href="http://127.0.0.1:3000/?local=0#view=desk">Research desk ↗</a></header>
<div class="toolbar"><label>Collection <select id="runs" aria-label="Choose collection"></select></label><div><small id="updated"></small> <button id="refresh">Refresh</button></div></div><p id="error" role="alert" hidden></p><div id="content" aria-live="polite">Loading collection ledger…</div><footer>Local monitor · refreshes every 15 seconds while visible · browser collection is currently supervised; no unattended schedule is enabled.</footer></main>
<script>
const $=id=>document.getElementById(id);let data=[],selected='';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const labels={pending:'Pending search',needs_auth:'Sign-in needed',review:'In progress',complete:'Complete',complete_with_exceptions:'Complete · held originals',no_results:'No results',staged:'Verified · staged',handed_off:'Saved to iCloud',duplicate:'Duplicate skipped'};
const pill=s=>`<span class="pill ${['complete','no_results','handed_off','duplicate'].includes(s)?'good':['reference_only','complete_with_exceptions'].includes(s)?'review':''}">${esc(labels[s]||s.replaceAll('_',' '))}</span>`;
function render(){let r=data.find(r=>r.id===selected)||data[0];if(!r){$('content').innerHTML='<p class="empty">No collections recorded yet.</p>';return}selected=r.id;const docs=r.documents,done=r.tasks.filter(t=>['complete','complete_with_exceptions','no_results'].includes(t.status)).length;
$('content').innerHTML=`<p>${esc(r.since)} → ${esc(r.until_date)} · ${esc([...new Set(r.tasks.map(t=>t.ticker))].join(' / '))}</p><div class="metrics">${[[done+'/'+r.tasks.length,'Searches completed'],[docs.filter(d=>d.status==='handed_off').length,'Originals saved to iCloud'],[docs.filter(d=>d.status==='duplicate').length,'Duplicates skipped'],[docs.filter(d=>d.status==='staged').length,'Staged originals']].map(([n,l])=>`<div class="metric"><strong>${esc(n)}</strong><span>${l}</span></div>`).join('')}</div><div class="grid"><section class="panel"><h2>Collection queue</h2>${r.tasks.map(t=>`<div class="task"><div><strong>${esc(t.ticker)}</strong><small>${t.kind==='transcript'?'Event transcripts':'Broker reports'}</small></div>${pill(t.status)}</div>`).join('')}</section><section class="panel"><h2>Search evidence & exceptions</h2>${r.observations.length?r.observations.map(o=>`<div class="note"><strong>${esc(o.ticker)} · ${esc(o.kind)} · ${o.result_count} results</strong><p>${esc(o.note)}</p><a href="${esc(o.source_url)}" target="_blank" rel="noopener noreferrer">Open observed search ↗</a></div>`).join(''):'<p class="empty">Search observations will appear as each company is checked.</p>'}<p>Saved to iCloud confirms the file handoff. Backend upload and availability for research are separate checks.</p></section></div><section class="panel"><h2>Verified originals</h2><div class="table-scroll"><table><thead><tr><th>Document</th><th>Published</th><th>Pages</th><th>Status</th><th>Source</th></tr></thead><tbody>${docs.map(d=>`<tr><td><strong>${esc(d.ticker)}</strong> · ${esc(d.filename)}<br><small>${esc(d.publisher||'Publisher not recorded')}</small></td><td>${esc(d.published||'Unknown')}</td><td>${d.pages}</td><td>${pill(d.usage==='reference_only'?'reference_only':d.status)}</td><td><a href="${esc(d.source_url)}" target="_blank" rel="noopener noreferrer">AlphaSense ↗</a></td></tr>`).join('')}</tbody></table></div>${docs.length?'':'<p class="empty">No originals have been downloaded and validated yet.</p>'}</section>`}
async function refresh(){try{const response=await fetch('/api/status',{signal:AbortSignal.timeout(10000)});if(!response.ok)throw Error('Collection ledger unavailable');const result=await response.json();data=result.runs;$('runs').innerHTML=data.map(r=>`<option value="${esc(r.id)}">${esc(r.since)} — ${esc(r.until_date)} · ${esc(r.id)}</option>`).join('');if(data.some(r=>r.id===selected))$('runs').value=selected;else selected=data[0]?.id||'';$('updated').textContent='Updated '+new Date().toLocaleTimeString();$('error').hidden=true;render()}catch(e){$('error').hidden=false;$('error').textContent='Could not refresh. Previously displayed information may be out of date.'}}
$('runs').onchange=e=>{selected=e.target.value;render()};$('refresh').onclick=refresh;refresh();setInterval(()=>{if(!document.hidden)refresh()},15000);
</script></html>
