<!DOCTYPE html>

    <meta charset="UTF-8">

    <!-- Theme selection, before first paint. Must stay ahead of the stylesheet
         link so the token block is already resolved when CSS first applies —
         otherwise a non-Dusk user gets a dark flash on every load. Kept inline
         and dependency-free for the same reason. Mirrors THEMES in src/app.jsx. -->
    <script>
    (function () {
        var THEMES = { ink: '#f4efe4', dusk: '#14110c', oak: '#ece1c9', bloc: '#efece2' };
        var t;
        try { t = localStorage.getItem('charlie_theme'); } catch (e) {}
        if (!THEMES[t]) t = 'dusk';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.backgroundColor = THEMES[t];
        // The <meta> below is authored as Dusk; correct it before the PWA reads it.
        document.addEventListener('DOMContentLoaded', function () {
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', THEMES[t]);
        });
    })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- One-time SW + cache nuke: recovers users with a stuck service worker
         from the T27 precompile cycle. Runs before any CDN script so those
         are fetched fresh from network, not from stale SW cache. -->
    <script>
    (function(){
      try {
        var flag = 'charlie_sw_nuked_v1';
        if (!localStorage.getItem(flag)) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs){
              regs.forEach(function(r){ r.unregister(); });
            }).catch(function(){});
          }
          if (window.caches && caches.keys) {
            caches.keys().then(function(ns){
              ns.forEach(function(n){ caches.delete(n); });
            }).catch(function(){});
          }
          localStorage.setItem(flag, '1');
          setTimeout(function(){ location.reload(); }, 400);
        }
      } catch(e) { /* ignore */ }
    })();
    </script>

    <!-- Theme faces. All four themes ship at once, so all six families load;
         display=swap keeps first paint unblocked. Never substitute Inter /
         Roboto / system stacks here — the aesthetic collapses without them. -->

    <!-- Critical CSS - prevents white flash, loads before scripts -->

        html, body, #root {
            background-color: var(--bg, #14110c);
            min-height: 100vh;
            margin: 0;
        }
    </style>
    
    <!-- React and dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.4/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.9.155/pdf.min.mjs" type="module"></script>
    <script>
        // Load pdf.js and set worker (with 8s timeout)
        window.pdfjsReady = Promise.race([
            import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.9.155/pdf.min.mjs').then(mod => {
                mod.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.9.155/pdf.worker.min.mjs';
                window.pdfjsLib = mod;
            }),
            new Promise(resolve => setTimeout(() => { window.pdfjsLib = null; resolve(); }, 8000))
        ]).catch(() => { window.pdfjsLib = null; });
    </script>
    <!-- Google Sign-In removed — using password auth -->
    <!-- Tailwind config is compiled into dist/tailwind.css via tailwind.config.js -->
    <style>
        .document-item.dragging { opacity: 0.5; }
        .document-item { transition: all 0.2s; }
        .drag-over { border-color: var(--accent) !important; background-color: color-mix(in srgb, var(--accent) 12%, transparent) !important; }
        /* Hide scrollbar for stock switcher */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        /* Thin scrollbar for filter areas */
        .scrollbar-thin::-webkit-scrollbar { height: 4px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: rgb(var(--c-white) / 0.15); border-radius: 2px; }
        .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: rgb(var(--c-white) / 0.25); }
        .scrollbar-thin { scrollbar-width: thin; scrollbar-color: rgb(var(--c-white) / 0.15) transparent; }
        /* Line clamp utilities */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        /* Bottom nav safe area */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
        /* Mobile content bottom spacing */
        @media (max-width: 767px) {
            .mobile-content-padding {
                padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px));
            }
        }
        /* Summary content formatting for better readability */
        /* The primary reading surface — analysis body copy. Themed end to end so
           it picks up each theme's body face and ink, not just its palette. */
        .summary-content {
            color: rgb(var(--c-slate-300));
            font-family: var(--font-body);
            font-size: 0.9375rem;
            line-height: 1.75;
        }
        .summary-content h1,
        .summary-content h2,
        .summary-content h3,
        .summary-content h4 {
            color: rgb(var(--c-slate-200));
            font-family: var(--font-display);
            font-weight: var(--display-weight);
            letter-spacing: var(--display-tracking);
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
        }
        .summary-content h2 {
            font-size: 1.125rem;
            border-bottom: 1px solid rgb(var(--c-white) / 0.1);
            padding-bottom: 0.5rem;
        }
        .summary-content h3 {
            font-size: 1rem;
        }
        .summary-content p {
            margin-bottom: 1rem;
        }
        /* Bullet points for paragraphs that start with bold text (webhook format).
           NOTE: previously used display:flex, which split the bold label and body
           into two flex items — on mobile this forced the body into a cramped
           narrow column. Now we hang a bullet in absolute position so the
           strong + body flows inline and wraps naturally like the emailed copy. */
        .summary-content > p:has(> strong:first-child),
        .summary-content > p:has(> b:first-child) {
            position: relative;
            padding-left: 1.25rem;
        }
        .summary-content > p:has(> strong:first-child)::before,
        .summary-content > p:has(> b:first-child)::before {
            content: '•';
            color: var(--faint);
            position: absolute;
            left: 0;
            top: 0;
        }
        .summary-content ul,
        .summary-content ol {
            margin-bottom: 1rem;
            padding-left: 1.5rem;
        }
        .summary-content li {
            margin-bottom: 0.5rem;
            padding-left: 0.25rem;
        }
        .summary-content li::marker {
            color: var(--faint);
        }
        .summary-content strong,
        .summary-content b {
            color: rgb(var(--c-slate-100));
            font-weight: 600;
        }
        .summary-content em,
        .summary-content i {
            color: var(--muted);
        }
        .summary-content blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 1rem;
            margin: 1rem 0;
            color: var(--muted);
        }
        /* Slide up animation for bottom sheets */
        @keyframes slide-up {
            from {
                transform: translateY(100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .animate-slide-up {
            animation: slide-up 0.3s ease-out forwards;
        }

        @keyframes mesh-flow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .glass-bg-mesh {
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 20%, #1c1408 50%, #171717 80%, #0f0f0f 100%);
            background-size: 400% 400%;
            animation: mesh-flow 20s ease infinite;

        /* Glass reads off --c-white, so the film inverts with the theme: a light
           veil on Dusk, a warm dark veil on Ink/Oak/Bloc. */
        .glass { background: rgb(var(--c-white) / 0.05); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgb(var(--c-white) / 0.1); }
        .glass-strong { background: rgb(var(--c-white) / 0.08); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgb(var(--c-white) / 0.15); }
        .glass-subtle { background: rgb(var(--c-white) / 0.03); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgb(var(--c-white) / 0.08); }
        .glow-teal { box-shadow: 0 0 20px color-mix(in srgb, var(--accent) 30%, transparent); }
        .glow-purple { box-shadow: 0 0 20px color-mix(in srgb, var(--accent) 30%, transparent); }
        /* Bloc trades glass for flat panels with hard rules. */
        [data-theme="bloc"] .glass,
        [data-theme="bloc"] .glass-strong,
        [data-theme="bloc"] .glass-subtle { background: var(--surface); backdrop-filter: none; -webkit-backdrop-filter: none; border: 2px solid var(--line); }
        [data-theme="bloc"] .glow-teal,
        [data-theme="bloc"] .glow-purple { box-shadow: var(--shadow); }
    </style>

<body style="margin: 0;">

    <!-- Service Worker Registration -->
    <script>
        // Register service worker for PWA functionality
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js', { updateViaCache: 'none' })
                    .then(registration => {
                        console.log('✅ ServiceWorker registered:', registration.scope);

                        // Force check for updates on every launch (iOS PWAs don't auto-check)
                        registration.update();

                        // Also check periodically (every 5 minutes while app is open)
                        setInterval(() => registration.update(), 5 * 60 * 1000);

                        // When a new SW is found, auto-activate and reload
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    // Skip waiting and reload immediately
                                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                                    window.location.reload();
                                }
                            });
                        });
                    })
                    .catch(err => {
                        console.log('❌ ServiceWorker registration failed:', err);
                    });
            });

            // Also reload when a new SW takes control (handles edge cases)
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                window.location.reload();
            });
        }

        // Install prompt for iOS
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            
            // Show install button (optional - you can add a button in UI later)
            console.log('💡 App can be installed');
        });

        // Track if app was installed
        window.addEventListener('appinstalled', () => {
            console.log('✅ App installed successfully');
            deferredPrompt = null;
        });

        // Detect if running as PWA
        if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
            console.log('📱 Running as PWA');
            document.body.classList.add('pwa-mode');
        }
    </script>
</body>
